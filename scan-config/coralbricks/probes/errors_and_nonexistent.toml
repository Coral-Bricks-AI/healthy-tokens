# Probes for CoralBricks Error Contracts, Non-Existent Routes (404/405), and Public Web Surfaces

# ---------------------------------------------------------------------------
# Unauthenticated Error Contracts (401)
# ---------------------------------------------------------------------------
[[probes]]
name = "Chat Completions Missing Key (POST /v1/chat/completions -> 401)"
tags = ["public", "errors", "smoke"]
checkers = ["status_401", "latency_api_800ms", "header_content_json", "openai_error_schema", "error_api_key_missing"]
[probes.fetcher]
type = "openai_chat_request"
url = "${base_url}/chat/completions"
model = "${default_model}"
messages = [{ role = "user", content = "hi" }]
max_tokens = 4
timeout = "${fast_timeout}"
retries = 3

[[probes]]
name = "OpenAI Responses Missing Key (POST /v1/responses -> 401)"
tags = ["public", "errors", "smoke"]
checkers = ["status_401", "latency_api_800ms", "header_content_json", "openai_error_schema", "error_api_key_missing"]
[probes.fetcher]
type = "openai_responses_request"
url = "${base_url}/responses"
model = "${default_model}"
input = "hi"
max_output_tokens = 4
timeout = "${fast_timeout}"
retries = 3

[[probes]]
name = "Anthropic Messages Missing Key (POST /v1/messages -> 401)"
tags = ["public", "errors", "smoke"]
checkers = ["status_401", "latency_api_800ms", "header_content_json", "anthropic_error_schema", "anthropic_error_envelope"]
[probes.fetcher]
type = "anthropic_messages_request"
url = "${base_url}/messages"
model = "${default_model}"
max_tokens = 4
messages = [{ role = "user", content = "hi" }]
timeout = "${fast_timeout}"
retries = 3

# ---------------------------------------------------------------------------
# Authenticated Validation & Org Policy Error Contracts (400 / 404)
# ---------------------------------------------------------------------------
[[probes]]
name = "Unknown Model Error (POST /v1/chat/completions model='nope' -> 404)"
tags = ["auth", "errors"]
checkers = ["status_404", "latency_api_800ms", "header_content_json", "openai_error_schema", "error_model_not_public"]
[probes.fetcher]
type = "openai_chat_request"
url = "${base_url}/chat/completions"
bearer_token = "${coralbricks_api_key}"
model = "nope"
messages = [{ role = "user", content = "hi" }]
max_tokens = 4
timeout = "${fast_timeout}"
retries = 3

[[probes]]
name = "Invalid reasoning_effort Enum (POST /v1/chat/completions -> 400)"
tags = ["auth", "errors"]
checkers = ["status_400", "latency_api_800ms", "header_content_json", "openai_error_schema", "error_unsupported_value"]
[probes.fetcher]
type = "openai_chat_request"
url = "${base_url}/chat/completions"
bearer_token = "${coralbricks_api_key}"
model = "${default_model}"
messages = [{ role = "user", content = "hi" }]
max_tokens = 4
reasoning_effort = "invalid_effort_value"
timeout = "${fast_timeout}"
retries = 3

[[probes]]
name = "Responses Background Disabled for Org (POST /v1/responses background=true -> 400)"
tags = ["auth", "errors", "responses"]
checkers = [
    "status_400",
    "latency_api_800ms",
    "header_content_json",
    "openai_error_schema",
    "error_unsupported_parameter",
    { name = "param_is_background", type = "json_path", path = "error.param", equal = ["background"] },
]
[probes.fetcher]
type = "openai_responses_request"
url = "${base_url}/responses"
bearer_token = "${coralbricks_api_key}"
model = "${default_model}"
input = "hi"
max_output_tokens = 8
background = true
timeout = "${fast_timeout}"
retries = 3

[[probes]]
name = "Responses previous_response_id Disabled for Org (POST /v1/responses -> 400)"
tags = ["auth", "errors", "responses"]
checkers = ["status_400", "latency_api_800ms", "header_content_json", "openai_error_schema"]
[probes.fetcher]
type = "openai_responses_request"
url = "${base_url}/responses"
bearer_token = "${coralbricks_api_key}"
model = "${default_model}"
input = "hi"
max_output_tokens = 8
previous_response_id = "resp_nonexistent123"
timeout = "${fast_timeout}"
retries = 3

[[probes]]
name = "Responses Fetch by ID Not Stored (GET /v1/responses/{id} -> 404)"
tags = ["auth", "errors", "responses"]
checkers = ["status_404", "latency_api_800ms", "header_content_json", "openai_error_schema", "error_response_not_found"]
[probes.fetcher]
type = "http_json"
method = "GET"
url = "${base_url}/responses/resp_00000000000000000000000000000000"
bearer_token = "${coralbricks_api_key}"
timeout = "${fast_timeout}"
retries = 3

# ---------------------------------------------------------------------------
# Method Not Allowed (405) & Non-Existent Routes (404)
